
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Age Calculator - ToolNoob</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f6f8;
    color: #171717;
}

header {
    height: 68px;
    background: white;
    border-bottom: 1px solid #e5e5e5;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 6%;
}

.logo {
    font-size: 25px;
    font-weight: 800;
}

.logo span {
    color: #666;
}

.home {
    text-decoration: none;
    color: #333;
    font-size: 14px;
}

.container {
    max-width: 850px;
    margin: auto;
    padding: 55px 20px;
}

.title {
    text-align: center;
    margin-bottom: 35px;
}

.title h1 {
    font-size: 40px;
    margin: 0 0 12px;
}

.title p {
    color: #777;
}

.calculator {
    background: white;
    border: 1px solid #e5e5e5;
    border-radius: 16px;
    padding: 30px;

    box-shadow:
        0 8px 30px rgba(0,0,0,.05);
}

label {
    display: block;
    font-weight: 700;
    margin-bottom: 8px;
}

input {
    width: 100%;
    padding: 14px;

    border: 1px solid #ccc;
    border-radius: 9px;

    font-size: 16px;
}

button {
    width: 100%;

    margin-top: 20px;

    padding: 14px;

    border: none;
    border-radius: 9px;

    background: #171717;
    color: white;

    font-size: 16px;
    font-weight: 700;

    cursor: pointer;
}

.result {
    display: none;

    margin-top: 25px;

    padding: 25px;

    background: #f1f2f4;

    border-radius: 10px;

    text-align: center;
}

.result h2 {
    margin: 0 0 10px;
}

.result-main {
    font-size: 30px;
    font-weight: 800;
}

.details {
    margin-top: 12px;
    color: #666;
}

.info {
    margin-top: 35px;

    background: white;

    border: 1px solid #e5e5e5;

    border-radius: 14px;

    padding: 25px;

    line-height: 1.7;
}

.info h2 {
    margin-top: 0;
}

footer {
    text-align: center;
    padding: 30px;
    color: #777;
    font-size: 13px;
}

</style>

</head>


<body>


<header>

<div class="logo">
    Tool<span>Noob</span>
</div>

<a
href="index.html"
class="home">

    ← All Tools

</a>

</header>


<main class="container">


<section class="title">

<h1>
    Age Calculator
</h1>

<p>
    Calculate your exact age from your date of birth.
</p>

</section>


<div class="calculator">

<label>
    Enter your date of birth
</label>

<input
    type="date"
    id="birthDate"
>


<button onclick="calculateAge()">
    Calculate Age
</button>


<div
    class="result"
    id="result">

<h2>
    Your Age
</h2>

<div
    class="result-main"
    id="ageResult">

</div>

<div
    class="details"
    id="details">

</div>

</div>

</div>


<section class="info">

<h2>
    About the Age Calculator
</h2>

<p>
    Enter your date of birth and the calculator
    will calculate your age in years, months
    and days.
</p>

</section>


</main>


<footer>

© 2026 ToolNoob · Free online tools

</footer>


<script>

function calculateAge() {

    const input =
        document.getElementById(
            "birthDate"
        ).value;


    if (!input) {

        alert(
            "Please enter your date of birth."
        );

        return;

    }


    const birth =
        new Date(input + "T00:00:00");


    const today =
        new Date();


    if (birth > today) {

        alert(
            "Date of birth cannot be in the future."
        );

        return;

    }


    let years =
        today.getFullYear()
        - birth.getFullYear();


    let months =
        today.getMonth()
        - birth.getMonth();


    let days =
        today.getDate()
        - birth.getDate();


    if (days < 0) {

        months--;

        const previousMonth =
            new Date(
                today.getFullYear(),
                today.getMonth(),
                0
            );

        days +=
            previousMonth.getDate();

    }


    if (months < 0) {

        years--;

        months += 12;

    }


    document.getElementById(
        "ageResult"
    ).textContent =

        years +
        " years, " +

        months +
        " months, " +

        days +
        " days";


    document.getElementById(
        "details"
    ).textContent =

        "Born: " +
        birth.toLocaleDateString();


    document.getElementById(
        "result"
    ).style.display =
        "block";

}

</script>


</body>

</html>
