
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Contact ToolNoob</title>

<meta
name="description"
content="Contact ToolNoob for questions, feedback and suggestions."
>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f6f7f9;
    color: #171717;
}

header {
    height: 70px;
    background: white;
    border-bottom: 1px solid #e5e5e5;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 6%;
}

.logo {
    font-size: 26px;
    font-weight: 800;
}

.logo span {
    color: #777;
}

.home {
    text-decoration: none;
    color: #333;
    font-size: 14px;
}

.container {
    max-width: 750px;
    margin: auto;
    padding: 70px 20px;
}

.card {
    background: white;
    border: 1px solid #e5e5e5;
    border-radius: 16px;
    padding: 40px;

    box-shadow:
        0 8px 30px rgba(0,0,0,.04);
}

h1 {
    font-size: 42px;
    margin-top: 0;
}

.subtitle {
    color: #666;
    line-height: 1.7;
    margin-bottom: 30px;
}

.field {
    margin-bottom: 20px;
}

label {
    display: block;
    font-weight: 700;
    margin-bottom: 8px;
}

input,
textarea {
    width: 100%;
    padding: 14px;

    border: 1px solid #ccc;
    border-radius: 9px;

    font-family: Arial, sans-serif;
    font-size: 16px;

    outline: none;
}

textarea {
    min-height: 150px;
    resize: vertical;
}

input:focus,
textarea:focus {
    border-color: #555;
}

button {
    width: 100%;
    padding: 14px;

    border: none;
    border-radius: 9px;

    background: #171717;
    color: white;

    font-size: 16px;
    font-weight: 700;

    cursor: pointer;
}

button:hover {
    background: #333;
}

.note {
    margin-top: 25px;
    padding: 18px;

    background: #f1f2f4;
    border-radius: 10px;

    color: #666;
    font-size: 14px;
    line-height: 1.6;
}

footer {
    text-align: center;
    padding: 35px;

    background: white;
    border-top: 1px solid #e5e5e5;

    color: #777;
    font-size: 13px;
}

footer a {
    color: #555;
    text-decoration: none;
    margin: 0 8px;
}

@media (max-width: 600px) {

    header {
        padding: 0 20px;
    }

    .card {
        padding: 25px;
    }

    h1 {
        font-size: 34px;
    }

}

</style>

</head>


<body>


<header>

<div class="logo">
    Tool<span>Noob</span>
</div>

<a
href="index.html"
class="home">

    ← Back to Tools

</a>

</header>


<main class="container">


<div class="card">


<h1>
    Contact ToolNoob
</h1>


<p class="subtitle">

Have a question, found a problem,
or have a suggestion?

Send us a message.

</p>


<form
action="https://formsubmit.co/sufyanp1121@gmail.com"
method="POST"
>


<input
type="hidden"
name="_subject"
value="New ToolNoob Contact Message"
>


<input
type="hidden"
name="_captcha"
value="false"
>


<input
type="hidden"
name="_template"
value="table"
>


<input
type="hidden"
name="_next"
value="https://YOUR-DOMAIN/contact.html?sent=true"
>


<div class="field">

<label for="name">
    Name
</label>

<input
type="text"
id="name"
name="name"
placeholder="Your name"
required
>

</div>


<div class="field">

<label for="email">
    Email
</label>

<input
type="email"
id="email"
name="email"
placeholder="you@example.com"
required
>

</div>


<div class="field">

<label for="message">
    Message
</label>

<textarea
id="message"
name="message"
placeholder="Write your message..."
required
></textarea>

</div>


<button type="submit">
    Send Message
</button>


</form>


<div class="note">

Your message will be sent to the
ToolNoob email address.

</div>


</div>


</main>


<footer>


<div style="margin-bottom: 15px;">

<a href="index.html">
    Home
</a>

<a href="about.html">
    About
</a>

<a href="privacy.html">
    Privacy
</a>

</div>


© 2026 ToolNoob · Free online tools


</footer>


</body>

</html>
